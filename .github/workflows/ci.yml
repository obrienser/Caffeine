name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Show the toolchain
        run: swift --version
      - name: Run the tests
        run: swift test --package-path Core

  app-build:
    name: App build
    # The project needs Xcode 27, which GitHub offers as a preview image for now.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show the toolchain
        run: xcodebuild -version
      - name: Build without signing
        run: >
          xcodebuild build -quiet
          -project Caffeine.xcodeproj
          -scheme Caffeine
          -configuration Release
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
